[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenscribe-mcp"
version = "1.0.0"
description = "Remote OAuth-protected Streamable HTTP MCP for Gemini video analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ashmitb95" }, { name = "prismosoft" }]
dependencies = [
  "google-genai>=1.40.0",
  "mcp[cli]>=1.25.0,<2.0.0",
  "uvicorn>=0.35.0",
  "starlette>=0.47.0",
]

[project.scripts]
screenscribe-mcp = "screenscribe.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/screenscribe"]
